name: Build standalone executables and publish release

# Déclenchement / triggers
#   - push sur main touchant le programme : si la version de
#     programme/updates.py a changé, le tag est créé et une release publiée ;
#   - déclenchement manuel (bouton « Run workflow »).
on:
  push:
    branches: [main]
    paths:
      - 'programme/**'
      - 'requirements.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from programme/updates.py
        id: get
        shell: bash
        run: |
          V=$(grep -oP '__version__\s*=\s*"\K[^"]+' programme/updates.py)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Does the tag already exist?
        id: check
        shell: bash
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.get.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.get.outputs.version }} already exists — no new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: CosmologicalDistanceCalculator-windows.exe
            label: Windows (x64)
          - os: ubuntu-22.04
            asset: CosmologicalDistanceCalculator-linux-x86_64
            label: Linux (x86_64, glibc 2.35+)
          - os: macos-13
            asset: CosmologicalDistanceCalculator-macos-intel.zip
            label: macOS (Intel, also runs on Apple Silicon through Rosetta)
          - os: macos-14
            asset: CosmologicalDistanceCalculator-macos-apple-silicon.zip
            label: macOS (Apple Silicon, native)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System libraries for Qt (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-xkb1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build the .ico icon (Windows only)
        if: runner.os == 'Windows'
        run: python -c "from PIL import Image; Image.open('programme/logo_256.png').save('app.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build the .icns icon (macOS only)
        if: runner.os == 'macOS'
        run: |
          mkdir -p icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s programme/logo_256.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
          done
          iconutil -c icns icon.iconset -o app.icns

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name CosmologicalDistanceCalculator
          --icon app.ico --paths programme
          --collect-all astropy --collect-data astropy_iers_data
          --collect-submodules scipy
          --hidden-import pyqtgraph --hidden-import i18n --hidden-import help_texts
          --hidden-import cosmo_core --hidden-import updates
          --add-data "programme/logo_16.png;." --add-data "programme/logo_32.png;."
          --add-data "programme/logo_64.png;." --add-data "programme/logo_128.png;."
          --add-data "programme/logo_256.png;."
          programme/redshift_distance_gui.py

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: >
          pyinstaller --noconfirm --clean --onefile
          --name CosmologicalDistanceCalculator
          --paths programme
          --collect-all astropy --collect-data astropy_iers_data
          --collect-submodules scipy
          --hidden-import pyqtgraph --hidden-import i18n --hidden-import help_texts
          --hidden-import cosmo_core --hidden-import updates
          --add-data "programme/logo_16.png:." --add-data "programme/logo_32.png:."
          --add-data "programme/logo_64.png:." --add-data "programme/logo_128.png:."
          --add-data "programme/logo_256.png:."
          programme/redshift_distance_gui.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name CosmologicalDistanceCalculator
          --icon app.icns --paths programme
          --osx-bundle-identifier org.arp273.cosmologicaldistances
          --collect-all astropy --collect-data astropy_iers_data
          --collect-submodules scipy
          --hidden-import pyqtgraph --hidden-import i18n --hidden-import help_texts
          --hidden-import cosmo_core --hidden-import updates
          --add-data "programme/logo_16.png:." --add-data "programme/logo_32.png:."
          --add-data "programme/logo_64.png:." --add-data "programme/logo_128.png:."
          --add-data "programme/logo_256.png:."
          programme/redshift_distance_gui.py

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          COSMO_NO_UPDATE_CHECK: '1'
        run: |
          Start-Process -FilePath dist\CosmologicalDistanceCalculator.exe -PassThru | Out-Null
          Start-Sleep -Seconds 45
          if (-not (Get-Process CosmologicalDistanceCalculator -ErrorAction SilentlyContinue)) {
            Write-Error "the executable stopped on its own"; exit 1
          }
          Stop-Process -Name CosmologicalDistanceCalculator -Force
          Write-Host "The executable starts and stays alive."

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          COSMO_NO_UPDATE_CHECK: '1'
        run: |
          ./dist/CosmologicalDistanceCalculator &
          PID=$!
          sleep 45
          kill -0 $PID || { echo "the executable stopped on its own"; exit 1; }
          kill $PID
          echo "The executable starts and stays alive."

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
          COSMO_NO_UPDATE_CHECK: '1'
        run: |
          ./dist/CosmologicalDistanceCalculator.app/Contents/MacOS/CosmologicalDistanceCalculator &
          PID=$!
          sleep 45
          kill -0 $PID || { echo "the app stopped on its own"; exit 1; }
          kill $PID
          echo "The app starts and stays alive."

      - name: Package with a stable name
        shell: bash
        run: |
          mkdir -p out
          case "${{ runner.os }}" in
            Windows) cp dist/CosmologicalDistanceCalculator.exe "out/${{ matrix.asset }}" ;;
            Linux)   cp dist/CosmologicalDistanceCalculator "out/${{ matrix.asset }}"
                     chmod +x "out/${{ matrix.asset }}" ;;
            macOS)   ( cd dist && zip -qry "../out/${{ matrix.asset }}" CosmologicalDistanceCalculator.app ) ;;
          esac
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          retention-days: 30

  release:
    needs: [version, build]
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Create the tag and the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: |
            out/CosmologicalDistanceCalculator-windows.exe
            out/CosmologicalDistanceCalculator-linux-x86_64
            out/CosmologicalDistanceCalculator-macos-intel.zip
            out/CosmologicalDistanceCalculator-macos-apple-silicon.zip
            cours/cours_distances_cosmologiques.pdf
            cours/course_cosmological_distances.pdf
          body: |
            **Cosmological Distance Calculator — v${{ needs.version.outputs.version }}**

            Redshift → four cosmological distances, in ΛCDM constrained by
            Planck 2018, with 1σ error bars, adjustable curvature and the SH0ES
            comparison. Bilingual interface (English / French).

            ### Download — nothing to install, no Python needed

            | Platform | File | Notes |
            |---|---|---|
            | **Windows** | `CosmologicalDistanceCalculator-windows.exe` | double-click. SmartScreen warns about unsigned programs: *More info* → *Run anyway* |
            | **macOS (Apple Silicon)** | `CosmologicalDistanceCalculator-macos-apple-silicon.zip` | unzip, then **right-click → Open** the first time (unsigned app) |
            | **macOS (Intel)** | `CosmologicalDistanceCalculator-macos-intel.zip` | same; also runs on Apple Silicon through Rosetta |
            | **Linux (x86_64)** | `CosmologicalDistanceCalculator-linux-x86_64` | `chmod +x` then run. Needs the usual Qt system libraries (see MANUAL §1.5) |

            Permanent links, always pointing at the latest build:

            ```
            https://github.com/${{ github.repository }}/releases/latest/download/CosmologicalDistanceCalculator-windows.exe
            https://github.com/${{ github.repository }}/releases/latest/download/CosmologicalDistanceCalculator-macos-apple-silicon.zip
            https://github.com/${{ github.repository }}/releases/latest/download/CosmologicalDistanceCalculator-macos-intel.zip
            https://github.com/${{ github.repository }}/releases/latest/download/CosmologicalDistanceCalculator-linux-x86_64
            ```

            ### From source
            `git clone` then `./launch.sh` (Linux, macOS) or `launch.bat`
            (Windows). If Python is missing, the launcher offers to install it.

            ### Also attached
            * `cours_distances_cosmologiques.pdf` — the 68-page course (French)
            * `course_cosmological_distances.pdf` — the 64-page course (English)
