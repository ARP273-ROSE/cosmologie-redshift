name: tests

# Tests à chaque push et pull request. Les paquets (installeur Windows, image
# disque macOS, archive Linux, archive de mise à jour) sont construits par
# .github/workflows/release.yml, déclenché par un tag « v* ».
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      COSMO_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - name: Outils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils xvfb libegl1 libgl1 \
            libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 libxcb-xkb1
          pip install pytest -r requirements.txt
      - name: Garde-fou de confidentialité (le dépôt est public)
        run: python -m pytest -q tests/test_confidentialite.py
      - name: Bilinguisme (clés, textes en dur, langue du système)
        run: |
          python verif_sage/test_i18n.py
          python -m pytest -q tests/test_i18n_textes.py
      - name: Cohérence du kit (verrou de l'installeur, version, kit.json)
        run: python -m pytest -q tests/test_kit.py
      - name: Recherche SIMBAD (partie réseau ignorée si injoignable)
        run: python verif_sage/test_simbad.py
      - name: Interface sous Xvfb (saisie, calculs, mise à jour, rapports)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" python verif_sage/test_gui_headless.py
          git checkout -- captures || true
          xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -q tests/test_gui_kit.py
